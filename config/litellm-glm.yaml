# ResearchOps managed LiteLLM GLM Responses bridge.
# Codex calls /v1/responses. LiteLLM translates each alias to Z.AI Chat Completions.
model_list:
  - model_name: glm-5.2-none
    litellm_params:
      model: zai/glm-5.2
      api_base: https://api.z.ai/api/paas/v4
      api_key: os.environ/ZAI_API_KEY
      use_chat_completions_api: true
      extra_body:
        thinking:
          type: disabled
        reasoning_effort: none
  - model_name: glm-5.2-high
    litellm_params:
      model: zai/glm-5.2
      api_base: https://api.z.ai/api/paas/v4
      api_key: os.environ/ZAI_API_KEY
      use_chat_completions_api: true
      extra_body:
        thinking:
          type: enabled
        reasoning_effort: high
  - model_name: glm-5.2-max
    litellm_params:
      model: zai/glm-5.2
      api_base: https://api.z.ai/api/paas/v4
      api_key: os.environ/ZAI_API_KEY
      use_chat_completions_api: true
      extra_body:
        thinking:
          type: enabled
        reasoning_effort: max

litellm_settings:
  drop_params: true
  telemetry: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
