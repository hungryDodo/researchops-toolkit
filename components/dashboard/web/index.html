<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResearchOps Dashboard</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div><h1 id="title">ResearchOps Dashboard</h1><p id="objective"></p></div><div class="badges"><span id="phase"></span><span id="health"></span><span id="gate"></span><span id="updated"></span></div></header>
<main>
<section class="card status"><h2>Program status</h2><div id="status"></div></section>
<section class="card routes"><h2>Candidate routes <small id="routes-count"></small></h2><div id="routes"></div></section>
<section class="card actions"><h2>Human actions <small id="actions-count"></small></h2><div id="actions"></div></section>
<section class="card proposals"><h2>Safeguard proposals <small id="proposals-count"></small></h2><div id="proposals"></div></section>
<section class="card experiments"><h2>Experiments <small id="experiments-count"></small></h2><div id="experiments"></div></section>
<section class="card intelligence"><h2>Model routing <small id="intelligence-count"></small></h2><div id="intelligence"></div></section>
<section class="card evidence"><h2>Claim & evidence <small id="evidence-count"></small></h2><div id="evidence"></div></section>
<section class="card storage"><h2>Storage & worktrees <small id="storage-count"></small></h2><div id="storage"></div></section>
<section class="card hygiene"><h2>Repository hygiene <small id="hygiene-count"></small></h2><div id="hygiene"></div></section>
<section class="card literature"><h2>Literature <small id="literature-count"></small></h2><div id="literature"></div></section>
<section class="card decisions"><h2>Decisions & risks <small id="decisions-count"></small></h2><div id="decisions"></div></section>
<section class="card logs"><h2>Key log <small id="logs-count"></small></h2><div id="logs"></div></section>
</main><div id="error"></div><script src="app.js"></script></body></html>
