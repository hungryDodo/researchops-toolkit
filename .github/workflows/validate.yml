name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q rops skills components behavior hooks tests
      - run: python -m rops validate
      - run: python tests/smoke.py
      - run: python tests/intelligence_smoke.py
      - run: python tests/behavior_smoke.py
      - run: python tests/model_control_plane_smoke.py
      - run: python tests/adoption_memory_smoke.py
      - run: python tests/product_benchmark_smoke.py
      - run: python -m rops evaluate --out /tmp/researchops-product-benchmark
      - run: python tests/package_smoke.py
      - run: python -m rops bootstrap /tmp/demo --title "CI Demo"
      - run: python -m rops dashboard validate --root /tmp/demo
      - run: python -m rops ledger --file /tmp/demo/.researchops/state/evidence/ledger.json validate
