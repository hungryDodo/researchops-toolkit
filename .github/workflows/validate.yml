name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m rops validate
      - run: python -m compileall -q rops skills components tests
      - run: python -m rops bootstrap /tmp/demo --title "CI Demo"
      - run: python -m rops dashboard validate --root /tmp/demo
      - run: python -m rops ledger --file /tmp/demo/.research/evidence/ledger.json validate
