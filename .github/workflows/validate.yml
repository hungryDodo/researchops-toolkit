name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Structural validation
        run: python -m rops validate
      - name: Behavior runtime smoke
        run: python tests/behavior_smoke.py
      - name: End-to-end workflow smoke
        run: python tests/smoke.py
      - name: Compile executable Python
        run: python -m compileall -q rops skills components behavior hooks tests
      - name: Component sanity
        run: |
          python -m rops bootstrap /tmp/demo --title "CI Demo"
          python -m rops dashboard validate --root /tmp/demo
          python -m rops ledger --file /tmp/demo/.research/evidence/ledger.json validate
